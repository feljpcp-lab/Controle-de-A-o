async function render(){try{await refresh()}catch(e){console.error(e);toast('Falha ao carregar dados: '+e.message,true)}const m=$('mainContent');if(role==='serra'&&currentPage!=='saw')currentPage='saw';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));const total=lots.reduce((s,l)=>s+Number(l.quantidade_barras||0),0),metros=lots.reduce((s,l)=>s+Number(l.quantidade_barras||0)*Number(l.comprimento_barra_mm||0),0)/1000;
if(currentPage==='dashboard')m.innerHTML=`<div class="page-head"><div><h2>Painel de controle</h2><p>Visão operacional do estoque e das atividades de corte.</p></div><span class="pill">Sistema conectado</span></div><div class="stats"><div class="stat"><span>Lotes ativos</span><strong>${lots.filter(l=>l.ativo).length}</strong></div><div class="stat"><span>Barras disponíveis</span><strong>${num(total)}</strong></div><div class="stat"><span>Estoque linear</span><strong>${num(metros.toFixed(1))} m</strong></div><div class="stat"><span>Sobras reutilizáveis</span><strong>${num(rems.reduce((s,r)=>s+Number(r.quantidade),0))}</strong></div></div><div class="notice">A lista de corte é planejamento. O estoque só é baixado no apontamento confirmado da serra. Perda por corte: <b>3 mm para diâmetro até 249,99 mm</b> e <b>4 mm a partir de 250 mm</b>.</div><div class="panel"><h3>Estoque por lote</h3>${stockTable(lots.slice(0,8))}</div><div class="panel"><h3>Listas de corte recentes</h3>${listTable(lists.slice(0,6))}</div>`;
if(currentPage==='stock')m.innerHTML=`<div class="page-head"><div><h2>Estoque de aço</h2><p>Saldo por lote, fornecedor e nota fiscal.</p></div><button onclick="window.go('receiving')">＋ Registrar entrada</button></div><div class="panel"><div class="field"><label>Buscar lote, fornecedor, NF, material ou diâmetro</label><input id="stockSearch" placeholder="Digite para filtrar..." oninput="window.filterStock()"></div><div id="stockTable" style="margin-top:15px">${stockTable(lots)}</div></div><div class="panel"><h3>Sobras reutilizáveis</h3>${remTable(rems)}</div>`;
if(currentPage==='receiving')m.innerHTML=`<div class="page-head"><div><h2>Entrada de material</h2><p>Registre origem e rastreabilidade do aço recebido.</p></div></div><div class="panel"><h3>Dados do lote</h3><form id="receiveForm"><div class="form-grid">${field('codigo_lote','Código interno do lote','text',true)}${field('fornecedor','Fornecedor','text',true)}${field('nota_fiscal','Nota fiscal','text',true)}${field('material','Material / qualidade','text',true,'H13')}${field('diametro_mm','Diâmetro (mm)','number',true,'', 'step="0.01" min="0.01"')}${field('comprimento_barra_mm','Comprimento da barra (mm)','number',true,'2400','min="1"')}${field('quantidade_barras','Quantidade de barras','number',true,'1','min="1" step="1"')}${field('localizacao','Localização','text',false,'')}<div class="field"><label>Certificado de qualidade (PDF/JPG/PNG, até 10 MB)</label><input name="certificado_file" type="file" accept=".pdf,application/pdf,image/jpeg,image/png"></div>${field('observacoes','Observações','text',false,'')}</div><div class="actions"><button>Salvar entrada</button><button type="reset" class="secondary">Limpar</button></div></form></div>`;
if(currentPage==='cutlists')m.innerHTML=`<div class="page-head"><div><h2>Listas de corte</h2><p>Cadastre o planejamento por OS e componente. Nenhuma baixa de estoque ocorre nesta etapa.</p></div></div><div class="panel"><h3>Importar lista de corte em PDF</h3><p class="muted">O sistema extrai as linhas, permite revisar os 45 itens (ou a quantidade encontrada) e só grava após sua confirmação. O PDF original fica em armazenamento privado.</p><div class="form-grid"><div class="field"><label>Arquivo PDF da produção</label><input id="cutPdfFile" type="file" accept="application/pdf"></div><div class="field" style="justify-content:end"><button type="button" onclick="window.readCutPdf()" >Ler PDF e revisar</button></div></div><div id="cutPdfPreview"></div><div class="notice">No PDF de 14/10/2026, o campo AÇO aparece vazio. A importação propõe H13 como padrão operacional, mas exige conferência do PCP antes de liberar os cortes. Totais impressos no documento serão comparados com a soma das dimensões extraídas.</div></div><div class="panel"><h3>Nova lista</h3><form id="listForm"><div class="form-grid">${field('codigo_lista','Código da lista','text',true)}${field('arquivo_nome','Nome do PDF (referência)','text',false)}${field('lista_obs','Observações','text',false)}</div><div class="actions"><button>Criar lista</button></div></form></div><div class="panel"><h3>Adicionar item à lista</h3><form id="itemForm"><div class="form-grid"><div class="field"><label>Lista</label><select name="lista_id" required>${lists.map(l=>`<option value="${l.id}">${esc(l.codigo_lista)} — ${esc(l.status)}</option>`).join('')}</select></div>${field('os','OS','text',true)}${field('componente','Componente','text',false)}${field('cliente','Cliente / extrusora','text',false)}${field('material_item','Material','text',true,'H13')}${field('diametro_item','Diâmetro (mm)','number',true,'','step="0.01" min="0.01"')}${field('comprimento_item','Comprimento da peça (mm)','number',true,'','min="0.01" step="0.1"')}${field('quantidade_planejada','Quantidade planejada','number',true,'1','min="1" step="1"')}</div><div class="actions"><button ${lists.length?'':'disabled'}>Adicionar item</button></div></form></div><div class="panel"><h3>Itens planejados</h3>${itemTable(items)}</div><div class="notice">A importação do PDF cria o planejamento e preserva o arquivo original. O estoque não é baixado nesta etapa; a baixa só acontece quando a serra confirma o corte real.</div>`;
if(currentPage==='saw')m.innerHTML=`<div class="page-head"><div><h2>Apontamento da serra</h2><p>O operador registra o corte realizado. Cada apontamento consome uma barra física.</p></div></div><div class="notice">Regra automática: diâmetro abaixo de 250 mm = 3 mm por corte; diâmetro igual ou superior a 250 mm = 4 mm por corte. Confira a sobra calculada antes de confirmar.</div><div class="panel"><h3>Registrar corte realizado</h3><form id="sawForm"><div class="form-grid"><div class="field"><label>Lote de aço</label><select name="lote_id" required>${lots.filter(l=>l.ativo&&l.quantidade_barras>0).map(l=>`<option value="${l.id}">${esc(l.codigo_lote)} • Ø${l.diametro_mm} • ${esc(l.material)} • ${l.quantidade_barras} barras</option>`).join('')}</select></div><div class="field"><label>Item da lista (opcional)</label><select name="item_lista_id"><option value="">Avulso / sem lista</option>${items.map(i=>`<option value="${i.id}">${esc(i.os)} • ${esc(i.componente||'')} • Ø${i.diametro_mm} • ${i.comprimento_mm} mm</option>`).join('')}</select></div>${field('os_saw','OS','text',true)}${field('componente_saw','Componente','text',false)}${field('quantidade_pecas','Quantidade de peças produzidas','number',true,'1','min="1" step="1"')}${field('comprimento_peca_mm','Comprimento de cada peça (mm)','number',true,'','min="0.01" step="0.1"')}${field('quantidade_cortes','Número real de cortes/serradas','number',true,'1','min="1" step="1"')}<div class="field"><label>Destino da sobra</label><select name="destino_sobra" required><option value="reutilizavel">Reutilizável (mínimo 100 mm)</option><option value="sucata">Sucata</option><option value="sem_sobra">Sem sobra</option></select></div>${field('obs_saw','Observações','text',false)}</div><div class="actions"><button ${lots.some(l=>l.quantidade_barras>0)?'':'disabled'}>Confirmar corte e baixar 1 barra</button></div></form></div><div class="panel"><h3>Últimos apontamentos</h3><p class="muted small">O histórico detalhado está disponível em Movimentações.</p><button class="secondary" onclick="window.go('history')">Ver histórico</button></div>`;
if(currentPage==='adjust')m.innerHTML=`<div class="page-head"><div><h2>Ajuste de inventário</h2><p>Compare o saldo do sistema com a contagem física e registre justificativa.</p></div></div><div class="panel"><form id="adjustForm"><div class="form-grid"><div class="field"><label>Lote</label><select name="lote_id" required>${lots.map(l=>`<option value="${l.id}">${esc(l.codigo_lote)} • Ø${l.diametro_mm} • Sistema: ${l.quantidade_barras} barras</option>`).join('')}</select></div>${field('quantidade_fisica','Quantidade física contada','number',true,'0','min="0" step="1"')}${field('justificativa','Justificativa obrigatória','text',true,'')}</div><div class="actions"><button>Registrar ajuste</button></div></form></div><div class="panel"><h3>Histórico de ajustes</h3><div id="adjustHistory" class="muted">Carregando…</div></div>`;
if(currentPage==='history')m.innerHTML=`<div class="page-head"><div><h2>Movimentações de estoque</h2><p>Rastreabilidade de entradas, consumos e ajustes.</p></div><button class="secondary" onclick="window.render()">Atualizar</button></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Lote</th><th>Variação barras</th><th>Comprimento mm</th><th>Referência</th><th>Observação</th></tr></thead><tbody id="movRows"><tr><td colspan="7">Carregando…</td></tr></tbody></table></div></div>`;
bindForms();if(currentPage==='history')loadHistory();if(currentPage==='adjust')loadAdjustHistory();}
function field(name,label,type='text',required=false,value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" ${required?'required':''} value="${esc(value)}" ${extra}></div>`}
function stockTable(rows){if(!rows.length)return '<div class="empty">Nenhum lote cadastrado.</div>';return `<div class="table-wrap"><table><thead><tr><th>Lote</th><th>Material</th><th>Diâmetro</th><th>Barra mm</th><th>Saldo barras</th><th>Estoque linear</th><th>Fornecedor</th><th>NF</th><th>Certificado</th><th>Localização</th></tr></thead><tbody>${rows.map(l=>`<tr><td><b>${esc(l.codigo_lote)}</b></td><td>${esc(l.material)}</td><td>Ø ${l.diametro_mm} mm</td><td>${num(l.comprimento_barra_mm)}</td><td><b>${num(l.quantidade_barras)}</b></td><td>${num(l.quantidade_barras*l.comprimento_barra_mm/1000)} m</td><td>${esc(l.fornecedor)}</td><td>${esc(l.nota_fiscal)}</td><td>${l.certificado_path?'<button class="secondary" data-cert="'+l.id+'" onclick="window.openCertificate(this.dataset.cert)">Abrir</button>':'—'}</td><td>${esc(l.localizacao||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function listTable(rows){if(!rows.length)return '<div class="empty">Nenhuma lista cadastrada.</div>';return `<div class="table-wrap"><table><thead><tr><th>Lista</th><th>Origem</th><th>Status</th><th>Data</th><th>PDF</th></tr></thead><tbody>${rows.map(l=>`<tr><td><b>${esc(l.codigo_lista)}</b></td><td>${esc(l.origem)}</td><td><span class="pill">${esc(l.status)}</span></td><td>${date(l.data_lista||l.criado_em)}</td><td>${l.arquivo_path?'<button class="secondary" onclick="window.openCutPdf(\''+l.id+'\')">Abrir PDF</button>':'—'}</td></tr>`).join('')}</tbody></table></div>`}
function itemTable(rows){if(!rows.length)return '<div class="empty">Nenhum item planejado.</div>';return `<div class="table-wrap"><table><thead><tr><th>Lista</th><th>OS</th><th>Componente</th><th>Material</th><th>Diâmetro</th><th>Comprimento</th><th>Planejado</th><th>Cortado</th><th>Cliente</th><th>Extrusora</th><th>Classe</th><th>Projetista</th></tr></thead><tbody>${rows.map(i=>`<tr><td>${esc(i.aco_listas_corte?.codigo_lista||'—')}</td><td><b>${esc(i.os)}</b></td><td>${esc(i.componente||'—')}</td><td>${esc(i.material)}</td><td>Ø${i.diametro_mm}</td><td>${i.comprimento_mm} mm</td><td>${i.quantidade_planejada}</td><td>${i.quantidade_cortada}</td><td>${esc(i.cliente||'—')}</td><td>${esc(i.extrusora||'—')}</td><td>${esc(i.classe||'—')}</td><td>${esc(i.projetista||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function remTable(rows){if(!rows.length)return '<div class="empty">Nenhuma sobra disponível.</div>';return `<div class="table-wrap"><table><thead><tr><th>Material</th><th>Diâmetro</th><th>Comprimento</th><th>Quantidade</th><th>Local</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.material)}</td><td>Ø${r.diametro_mm}</td><td>${r.comprimento_mm} mm</td><td>${r.quantidade}</td><td>${esc(r.localizacao||'—')}</td></tr>`).join('')}</tbody></table></div>`}

window.pendingPdfImport=null;
window.readCutPdf=async function(){
 const input=$('cutPdfFile'),target=$('cutPdfPreview'),file=input&&input.files&&input.files[0];
 if(!file)return toast('Selecione o PDF da lista de corte.',true);
 if(file.type!=='application/pdf'&& !file.name.toLowerCase().endsWith('.pdf'))return toast('Selecione um arquivo PDF.',true);
 if(file.size>20*1024*1024)return toast('O PDF deve ter até 20 MB.',true);
 target.innerHTML='<div class="muted">Lendo o documento…</div>';
 try{
  const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
  const pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise;
  let textLines=[];
  for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
   const page=await pdf.getPage(pageNo),content=await page.getTextContent();
   const items=content.items.filter(x=>x.str&&x.str.trim()).map(x=>({str:x.str.trim(),x:x.transform[4],y:x.transform[5]})).sort((a,b)=>b.y-a.y||a.x-b.x);
   const lines=[];
   for(const it of items){let line=lines.find(l=>Math.abs(l.y-it.y)<2.5);if(!line){line={y:it.y,parts:[]};lines.push(line)}line.parts.push(it)}
   textLines.push(...lines.sort((a,b)=>b.y-a.y).map(l=>l.parts.sort((a,b)=>a.x-b.x).map(x=>x.str).join(' ')));
  }
  let rawRows=[],current='';
  for(const line of textLines){
   if(/^\s*\d{1,2}\s+\d{4,6}\s+/.test(line)){if(current)rawRows.push(current);current=line}
   else if(current&&!/^\s*Total\s*:/i.test(line)&&!/Lista de Corte de Aço/i.test(line)&&!/O\.\s*S\./i.test(line)){current+=' '+line}
  }
  if(current)rawRows.push(current);
  const parsed=[];
  for(const raw of rawRows){
   const m=raw.match(/^\s*\d{1,2}\s+(\d{4,6})\s+(.+?)\s+Ø\s*(\d{2,3})\s*[xX×]\s*(\d{1,3}(?:[.,]\d+)?)([\s\S]*)$/i);
   if(!m)continue;
   let tail=(m[5]||'').trim(),classe='',projetista='';
   const cm=tail.match(/\b(Sólida|Tubular|Semi[- ]?tubular)\s*$/i);
   if(cm){classe=cm[1];tail=tail.slice(0,cm.index).trim()}
   const pm=tail.match(/\b(Luan|Nayara|Cleberson|Rosinei)\s*$/i);
   if(pm){projetista=pm[1];tail=tail.slice(0,pm.index).trim()}
   let extrusora='';const em=tail.match(/\s+(Ind)\s*$/i);if(em){extrusora=em[1];tail=tail.slice(0,em.index).trim()}
   parsed.push({os:m[1],componente:m[2].trim(),diametro_mm:Number(m[3].replace(',','.')),comprimento_mm:Number(m[4].replace(',','.')),cliente:tail,extrusora:extrusora,projetista:projetista,classe:classe,material:'H13',codigo_barra:'',fonte_linha:raw});
  }
  const allText=textLines.join('\n'),dateMatch=allText.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);
  let listDate=null;
  if(dateMatch){let yy=dateMatch[3];if(yy.length===2)yy='20'+yy;listDate=yy+'-'+dateMatch[2].padStart(2,'0')+'-'+dateMatch[1].padStart(2,'0')}
  const summaries=[],re=/Total\s*:\s*(\d+)\s*pç\(s\)\s*Ø\s*(\d{2,3})\s*=\s*([\d.,]+)\s*mm/gi;let sm,groupIndex=0;
  while((sm=re.exec(allText))!==null){const count=Number(sm[1]),diametro=Number(sm[2]),expected=Number(sm[3].replace(/\./g,'').replace(',','.'));const group=parsed.slice(groupIndex,groupIndex+count);groupIndex+=count;const soma=group.reduce((a,r)=>a+r.comprimento_mm,0);const perda=diametro<250?3:4;const extraido=Number((soma+count*perda).toFixed(2));summaries.push({diametro:diametro,quantidade:count,esperado:expected,extraido:extraido,diferenca:Number((extraido-expected).toFixed(2)),linhas:group.length,diametroDivergente:group.some(r=>r.diametro_mm!==diametro)})}
  window.pendingPdfImport={file:file,rows:parsed,dataLista:listDate,summaries:summaries};
  if(!parsed.length){target.innerHTML='<div class="notice">Não consegui reconhecer linhas de itens neste PDF. Nenhum dado foi gravado. Confira se o arquivo contém texto selecionável, não apenas imagem.</div>';return}
  const totalDiff=summaries.some(x=>Math.abs(x.diferenca)>0.01);
  let html='<div class="notice">Itens reconhecidos: <b>'+parsed.length+'</b> • Data da lista: <b>'+esc(listDate||'não identificada')+'</b> • '+(totalDiff?'Há divergências entre a soma das dimensões e os totais impressos.':'Totais impressos comparados ao cálculo com a perda FELJ (3 mm abaixo de Ø250; 4 mm a partir de Ø250).')+'</div>';
  if(summaries.length)html+='<div class="table-wrap"><table><thead><tr><th>Diâmetro</th><th>Total impresso (mm)</th><th>Calculado com perda FELJ (mm)</th><th>Diferença (mm)</th></tr></thead><tbody>'+summaries.map(x=>'<tr><td>Ø'+x.diametro+'</td><td>'+x.esperado.toLocaleString('pt-BR')+'</td><td>'+x.extraido.toLocaleString('pt-BR',{maximumFractionDigits:2})+'</td><td><b>'+x.diferenca.toLocaleString('pt-BR',{maximumFractionDigits:2})+'</b></td></tr>').join('')+'</tbody></table></div>';
  html+='<div class="table-wrap"><table><thead><tr><th>OS</th><th>Componente</th><th>Diâmetro</th><th>Dimensão (mm)</th><th>Cliente</th><th>Extrusora</th><th>Projetista</th><th>Classe</th></tr></thead><tbody>'+parsed.map(r=>'<tr><td>'+esc(r.os)+'</td><td>'+esc(r.componente)+'</td><td>Ø'+r.diametro_mm+'</td><td>'+r.comprimento_mm.toLocaleString('pt-BR',{maximumFractionDigits:2})+'</td><td>'+esc(r.cliente||'—')+'</td><td>'+esc(r.extrusora||'—')+'</td><td>'+esc(r.projetista||'—')+'</td><td>'+esc(r.classe||'—')+'</td></tr>').join('')+'</tbody></table></div>';
  html+='<div class="actions"><button type="button" onclick="window.confirmPdfImport()" '+(['admin','pcp'].includes(role)?'':'disabled')+'>Confirmar importação de '+parsed.length+' itens</button><button type="button" class="secondary" onclick="window.cancelPdfImport()">Cancelar</button></div>';
  target.innerHTML=html;
 }catch(err){console.error(err);target.innerHTML='<div class="notice">Falha ao ler o PDF: '+esc(err.message||err)+'</div>';toast('Não foi possível interpretar o PDF.',true)}
};
window.cancelPdfImport=function(){window.pendingPdfImport=null;$('cutPdfPreview').innerHTML='';if($('cutPdfFile'))$('cutPdfFile').value=''};
window.confirmPdfImport=async function(){
 const p=window.pendingPdfImport;if(!p||!p.rows.length)return toast('Leia e revise um PDF antes de importar.',true);
 if(!['admin','pcp'].includes(role))return toast('Somente administrador ou PCP pode importar listas.',true);
 const safeName=p.file.name.normalize('NFKD').replace(/[^a-zA-Z0-9._-]/g,'_');
 const path=user.id+'/'+Date.now()+'_'+safeName;
 const {error:uploadError}=await sb.storage.from('aco-listas-pdf').upload(path,p.file,{upsert:false,contentType:'application/pdf'});
 if(uploadError)return toast('Falha ao armazenar o PDF: '+uploadError.message,true);
 const dateCode=(p.dataLista||new Date().toISOString().slice(0,10)).replace(/-/g,'');
 const code='PDF-'+dateCode+'-'+Date.now().toString().slice(-4);
 const discrepancy=p.summaries.filter(x=>Math.abs(x.diferenca)>0.01).map(x=>'Ø'+x.diametro+': impresso '+x.esperado+' mm, total calculado com perda FELJ '+x.extraido+' mm, diferença '+x.diferenca+' mm').join('; ');
 const note='Importação PDF revisada pelo usuário. O campo AÇO estava vazio no documento; material H13 aplicado como padrão operacional e deve ser conferido pelo PCP.'+(discrepancy?' Divergências de total: '+discrepancy:'');
 const {data,error}=await sb.rpc('aco_importar_lista_corte',{p_codigo_lista:code,p_arquivo_nome:p.file.name,p_arquivo_path:path,p_data_lista:p.dataLista,p_itens:p.rows,p_observacoes:note});
 if(error){await sb.storage.from('aco-listas-pdf').remove([path]);return toast('A importação foi cancelada: '+error.message,true)}
 toast('PDF importado: '+p.rows.length+' itens, sem baixa de estoque.');
 window.pendingPdfImport=null;currentPage='cutlists';render();
};

const sf=$('sawForm');if(sf)sf.onsubmit=async e=>{e.preventDefault();const f=new FormData(sf);if(!confirm('Confirmar o corte real? Esta ação baixará 1 barra do lote selecionado.'))return;const {error}=await sb.rpc('aco_confirmar_corte',{p_lote_id:f.get('lote_id'),p_item_lista_id:f.get('item_lista_id')||null,p_os:f.get('os_saw'),p_componente:f.get('componente_saw')||null,p_quantidade_pecas:Number(f.get('quantidade_pecas')),p_comprimento_peca_mm:Number(f.get('comprimento_peca_mm')),p_quantidade_cortes:Number(f.get('quantidade_cortes')),p_destino_sobra:f.get('destino_sobra'),p_observacoes:f.get('obs_saw')||null});if(error)return toast(error.message,true);toast('Corte confirmado; estoque atualizado e movimento registrado.');sf.reset();render()};
const af=$('adjustForm');if(af)af.onsubmit=async e=>{e.preventDefault();const f=new FormData(af);if(!confirm('Confirmar ajuste do saldo para a quantidade física informada?'))return;const {error}=await sb.rpc('aco_confirmar_ajuste',{p_lote_id:f.get('lote_id'),p_quantidade_fisica:Number(f.get('quantidade_fisica')),p_justificativa:f.get('justificativa')});if(error)return toast(error.message,true);toast('Ajuste registrado com histórico.');render()};
}
